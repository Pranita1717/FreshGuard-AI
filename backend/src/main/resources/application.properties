server.port=8080
spring.application.name=freshguard-backend

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/freshguard

# JWT Configuration (minimum 256 bits for HMAC-SHA256)
jwt.secret=FreshGuardAiSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026Secure
jwt.expiration=86400000

# File Upload Settings for OCR images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.freshguardai=DEBUG
logging.level.org.springframework.security=INFO
